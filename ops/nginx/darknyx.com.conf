server {
    server_name darknyx.com www.darknyx.com;

    root /opt/darknyx/web;
    index index.html;

    server_tokens off;

    # Security headers - a first hardening pass, not a fully strict
    # CSP: the app's JS/CSS is inline in index.html rather than
    # external files, so script-src/style-src need 'unsafe-inline' to
    # avoid breaking the page outright. Tightening that properly means
    # moving to external files with a nonce, a bigger follow-up change,
    # not something to guess at live on a production vhost.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Deny access to dotfiles (.env, .git, etc.) regardless of location -
    # defense in depth; none currently live under web/, but a future
    # deploy mistake shouldn't turn into an exposure.
    location ~ /\. {
        deny all;
    }

    # "No query logging" is a stated privacy commitment on the site itself
    # (see the footer) - nginx's default access log captures the full
    # request line including query strings, which would silently log every
    # search term, pasted scam text, and breach-check email otherwise.
    # Found during a feature-completeness audit; fixed at the source
    # rather than leaving the claim false in practice.
    location /api/ {
        access_log off;
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static asset dirs: a missing file must return a real 404, not fall
    # through to the SPA's index.html - that fallback is only meant for
    # client-side routes, and was breaking every <img onerror> check for
    # a preview/favicon that hasn't been captured yet.
    location /previews/ {
        try_files $uri =404;
    }
    location /favicons/ {
        try_files $uri =404;
    }
    location /ransomware-screens/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/darknyx.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/darknyx.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.darknyx.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = darknyx.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name darknyx.com www.darknyx.com;
    return 404; # managed by Certbot




}
